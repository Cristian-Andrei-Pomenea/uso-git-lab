# Copiaza acest fisier in .github/workflows/ci.yml intr-un repository GitHub REAL.
# NU este folosit de simulatorul HTML.
name: USO - C build and smoke test

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify source files
        run: |
          test -f README.md
          test -f bubble-sort.c

      - name: Build Bubble Sort
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror bubble-sort.c -o bubble-sort

      - name: Smoke test (reverse-sorted input)
        run: |
          printf '5\n5 4 3 2 1\n' | ./bubble-sort | grep -q '1 2 3 4 5'
